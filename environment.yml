# conda env create -f environment.yml && conda activate multirotor-opt
name: multirotor-opt
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - ffmpeg
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu130
      - torch==2.14.1
      - numpy==2.2.6
      - scipy==1.16.2
      - newton==1.6.1
      - warp-lang==1.18.0
      - ax-platform==1.3.1
      - cma==4.5.0
      - python-fcl==0.7.0.11
      - opencv-python-headless==4.12.0.88
      - matplotlib==3.10.6
